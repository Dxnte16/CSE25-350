<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <section class="container">
                <a class="navbar-brand" href="index.html">GET FLY</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <section class="collapse navbar-collapse" id="mainNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">HOME</a></li>
                        <li class="nav-item"><a class="nav-link" href="shop.html">SHOP</a></li>
                        <li class="nav-item"><a class="nav-link" href="products.html">PRODUCTS</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">ABOUT</a></li>
                        <li class="nav-item"><a class="nav-link active" href="contact.html">CONTACT</a></li>
                        <li class="nav-item"><a class="nav-link" href="cart.html">CART</a></li>
                    </ul>
                </section>
            </section>
        </nav>
    </header>

    <main class="container">
        <h1 class="section-title">CONTACT GET FLY</h1>
        <form action="#" method="post">
            <section class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" name="name" class="form-control" required>
            </section>

            <section class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </section>

            <section class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea id="message" name="message" rows="6" class="form-control" required></textarea>
            </section>

            <button type="submit" class="black-btn">Submit</button>
        </form>
    </main>

    <footer>
        <section class="container">
            <p>Copyright &copy; 2026 GET FLY, Gaborone, Botswana</p>
            <p>Authentic resell. Affordable streetwear.</p>
            <p>Email: getfly@example.com</p>

                <a href="contact.html">Contact</a> |
                <a href="cart.html">Cart</a>
            </p>
            <p>Instagram | Facebook | TikTok</p>
        </section>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
