<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GET FLY | Feedback</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <a class="brand" href="index.html">GET FLY</a>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="cart.html">Cart</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="page-title">
            <h1>Feedback</h1>
            <p>Tell us what you think about GET FLY.</p>
        </section>

        <section class="form-section">
            <h2>Customer Feedback Form</h2>
            <form action="#" method="post">
                <label for="feedback-name">Name</label>
                <input type="text" id="feedback-name" name="feedback-name" required>

                <label for="feedback-email">Email</label>
                <input type="email" id="feedback-email" name="feedback-email" required>

                <label for="rating">Rating</label>
                <select id="rating" name="rating" required>
                    <option value="">Select rating</option>
                    <option value="1">1 - Poor</option>
                    <option value="2">2 - Fair</option>
                    <option value="3">3 - Good</option>
                    <option value="4">4 - Very Good</option>
                    <option value="5">5 - Excellent</option>
                </select>

                <label for="comments">Comments</label>
                <textarea id="comments" name="comments" rows="6" required></textarea>

                <button type="submit">Send Feedback</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Copyright &copy; 2026 GET FLY, Gaborone, Botswana</p>
        <p>Authentic resell. Affordable streetwear.</p>
        <p><a class="active" href="feedback.html">Feedback</a> | <a href="#">Instagram</a> | <a href="#">Facebook</a> | <a href="#">TikTok</a></p>
    </footer>
</body>
</html>
